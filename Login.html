            <form action="PHP/verificar.php" method="POST">

                <div style="margin-bottom: 15px;">
                  <p style="margin: 5px 0; font-weight: bold;">RM:</p>
    
              <input type="text" id="RM" name="rm" placeholder="Digite seu RM" maxlength="5" inputmode="numeric" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required style="width: 350px; padding: 15px; border-radius: 16px; border: none;">
                </div>



                <div style="margin-bottom: 15px;">
                    <p style="margin: 5px 0; font-weight: bold;">Nome:</p>
                    <input type="nome" id="nome" name="nome" placeholder="Digite seu nome" maxlength="80" required style="width: 350px; padding: 15px; border-radius: 16px; border: none;">
                </div>
                
                <br>
                
                <!-- Aplicando sua classe .Login já existente no botão -->
