    <!-- Usando header para manter o fundo roxo/azul e centralizando o conteúdo -->
    <header class="header">
        <!-- headline para manter a formatação de texto e cor -->
        <div class="headline" style="margin: 0; text-align: center;">
            <h2>Registre um Usuário</h2>
            <br>
            
          <form action="PHP/cadastrar_aluno.php" method="POST">

    <div style="margin-bottom: 15px;">
        <p style="margin: 5px 0; font-weight: bold;">RM:</p>

        
        <input
            type="text"
            id="RM"
            name="rm"
            placeholder="Digite seu RM"
            maxlength="5"
            pattern="[0-9]{5}"
            inputmode="numeric"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
            required
            style="width: 350px; padding: 15px; border-radius: 16px; border: none;"
        >
    </div>

    <div style="margin-bottom: 15px;">
        <p style="margin: 5px 0; font-weight: bold;">Nome:</p>

        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome completo"
            maxlength="100"
            required
            style="width: 350px; padding: 15px; border-radius: 16px; border: none;"
        >
    </div>

    <br>

    <button
        type="submit"
        class="Login"
        style="border: none; border-radius: 16px; cursor: pointer; width: 350px;"
    >
        Cadastrar aluno
    </button>

</form>
